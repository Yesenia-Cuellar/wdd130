<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mountain River Adventures | Contact Us</title>
    <meta name="description"
      content="Contact Mountain River Adventures for rafting reservations, questions and information about our services.">
    <meta name="author" content="Yesenia Cuellar">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/logo.webp" alt="Mountain River logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>

        <section class="contact-info">
            <h1>Contact Us</h1>

            <h2>Get in Touch</h2>

            <p><strong>Address:</strong> 123 Mountain River Road, Colorado, USA</p>
            <p><strong>Phone:</strong> +1 (555) 123-4567</p>
            <p><strong>Email:</strong> info@mountainriveradventures.com</p>

            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d501947.7196336123!2d-84.84145061958627!3d10.620816152241927!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8f7553fb2547cc07%3A0xb4a92195a676dd53!2sParque%20Nacional%20Volc%C3%A1n%20Tenorio%20-%20Rio%20Celeste!5e0!3m2!1ses!2scr!4v1790967114067!5m2!1ses!2scr"
              width="600" height="450" allowfullscreen="" loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin">

            </iframe>

        </section>

        <section class="employees">
            <h2>Meet Our Team</h2>

            <figure>
                <img src="images/employee1.webp" alt="Adrian Oconer, Safety Coordinator">
                <figcaption>Adrian Oconer - Safety Coordinator</figcaption>
            </figure>

            <figure>
                <img src="images/employee2.webp" alt="Michael Sanchez, Customer Service Manager">
                <figcaption>Michael Sanchez - Customer Service Manager</figcaption>
            </figure>

            <figure>
                <img src="images/employee3.webp" alt="Marvin Richarson, River Guide">
                <figcaption>Marvin Richarson - River Guide</figcaption>
            </figure>

        </section>

        <section class="contact-form">
            <h2>Send Us a Message</h2>

            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <fieldset>
                    <legend>Purpose of Message</legend>

                    <label>
                        <input type="radio" name="purpose" value="general" required>
                        General Inquiry
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="reservation">
                        Reservation Question
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="6" required></textarea>

                <label>
                    <input type="checkbox" name="newsletter">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Send Message</button>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Mountain River Adventures | Yesenia Cuellar</p>

        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook Icon" width="40" height="40">
            </a>

            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn Icon" width="40" height="40">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon" width="40" height="40">
            </a>

        </nav>
    </footer>

</body>

</html>
